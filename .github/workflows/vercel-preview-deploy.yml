name: Vercel Preview Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: 🚀 Deploy Preview
    runs-on: ubuntu-latest
    environment: Preview
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Info
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"

      - name: Assign Staging Alias (develop branch only)
        if: github.ref == 'refs/heads/develop'
        run: |
          vercel alias set ${{ steps.deploy.outputs.preview_url }} staging.camiart.com \
            --token=${{ secrets.VERCEL_TOKEN }}
          echo "✅ Staging alias set: https://staging.camiart.com"

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
            const body = `## 🚀 Preview Deploy\n\n**URL:** ${previewUrl}\n\n_Generated by Vercel Preview Deploy workflow._`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  smoke-test:
    name: 🔥 Smoke Tests
    needs: deploy-preview
    runs-on: ubuntu-latest
    environment: Preview

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Wait for deployment to be ready
        run: |
          URL=${{ needs.deploy-preview.outputs.preview_url }}
          echo "Waiting for $URL to be ready..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Deployment ready (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i/30 - HTTP $STATUS - waiting..."
            sleep 5
          done
          echo "❌ Deployment not ready after 30 attempts"
          exit 1

      - name: Run Smoke Tests
        run: npm run smoke:staging
        env:
          BASE_URL: ${{ needs.deploy-preview.outputs.preview_url }}

  build-check:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest
    environment: Preview

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript Check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build Project
        run: npm run build:turbo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_STAGING }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY_STAGING }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL_STAGING }}
          QUOTES_REPOSITORY_DRIVER: json
          RATE_LIMIT_STORE_DRIVER: memory
          REDIS_URL: ${{ secrets.REDIS_URL_TEST }}
