name: products-image-cleanup-hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  trigger-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cleanup endpoint
        env:
          CLEANUP_BASE_URL: ${{ secrets.CLEANUP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured in GitHub secrets"
            exit 1
          fi

          BASE_URL="$CLEANUP_BASE_URL"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="https://camiart.com"
          fi

          ENDPOINT="$BASE_URL/api/cron/products-image-cleanup"
          echo "Calling $ENDPOINT"

          HTTP_CODE=$(curl --silent --show-error --location \
            --header "Authorization: Bearer $CRON_SECRET" \
            --write-out "%{http_code}" \
            --output response.json \
            "$ENDPOINT")

          cat response.json

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Cleanup request failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Cleanup request completed with HTTP $HTTP_CODE"

      - name: Notify Slack on failure
        if: ${{ failure() && secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MESSAGE="[ALERTA] products-image-cleanup-hourly fallo en ${GITHUB_REPOSITORY} (branch: ${GITHUB_REF_NAME}). Run: ${RUN_URL}"
          curl --silent --show-error --fail \
            -X POST \
            -H "Content-type: application/json" \
            --data "{\"text\":\"${MESSAGE}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Warn when Slack webhook is missing
        if: ${{ failure() && secrets.SLACK_WEBHOOK_URL == '' }}
        run: |
          echo "Workflow failed but SLACK_WEBHOOK_URL is not configured."
          echo "Set GitHub Actions secret SLACK_WEBHOOK_URL to enable failure alerts."
