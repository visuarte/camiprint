name: Build & Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-checks:
    name: Watchdog & Vulnerability Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🔍 Brand Watchdog Check
        run: pnpm run watchdog:brand
        continue-on-error: false

      - name: 📊 Vulnerability Scan
        run: pnpm run vuln:monitor
        continue-on-error: true

      - name: 🔐 Strict Vulnerability Check (High/Critical only)
        run: pnpm run vuln:monitor:strict
        continue-on-error: true

  build:
    name: Build & Tests
    runs-on: ubuntu-latest
    needs: security-checks
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🏗️ Build Project
        run: pnpm run build:turbo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          QUOTES_REPOSITORY_DRIVER: json
          RATE_LIMIT_STORE_DRIVER: memory

      - name: 📝 TypeScript Check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: 🧪 Run Tests
        run: pnpm run test:all
        continue-on-error: true

  e2e-mobile-smoke:
    name: E2E Mobile Smoke (iPhone)
    runs-on: ubuntu-latest
    needs: security-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: 📱 Run iPhone contact smoke + watchdog endpoint
        run: pnpm run test:e2e:mobile-smoke

  e2e-mobile-smoke-pixel-optional:
    name: E2E Mobile Smoke (Pixel) Optional
    runs-on: ubuntu-latest
    needs: security-checks
    if: ${{ vars.RUN_OPTIONAL_DEVICE_JOBS == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: 🤖 Run Pixel contact smoke + watchdog endpoint
        run: pnpm run test:e2e:mobile-smoke:pixel
        continue-on-error: true

  e2e-browserstack-safari-optional:
    name: E2E Safari BrowserStack Optional
    runs-on: ubuntu-latest
    needs: security-checks
    if: ${{ vars.RUN_OPTIONAL_DEVICE_JOBS == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate BrowserStack credentials
        id: browserstack-check
        shell: bash
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "BrowserStack secrets missing. Optional Safari job will be skipped."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "BrowserStack credentials detected."
          fi

      - name: 🧭 Run Safari real-browser smoke in BrowserStack
        if: steps.browserstack-check.outputs.available == 'true'
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: pnpm run test:e2e:browserstack:safari
        continue-on-error: true

  upload-reports:
    name: Upload Security Reports
    runs-on: ubuntu-latest
    needs: security-checks
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Vulnerability Report
        run: pnpm run vuln:monitor
        continue-on-error: true

      - name: Upload Vulnerability Reports as Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-reports
          path: |
            .vuln-report.json
            .vuln-history.json
          retention-days: 30

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [security-checks, build]
    if: failure()
    
    steps:
      - name: Post failure comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Build & Security Checks Failed**\n\nPlease check the logs for:\n- Brand violations (watchdog)\n- Vulnerability scan results\n- Build/TypeScript errors\n- Test failures'
            })
        if: github.event_name == 'pull_request'
